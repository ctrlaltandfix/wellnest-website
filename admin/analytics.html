<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site Statistics · WellNest</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Matches the wellnest.services landing page: dark green hero, Bricolage Grotesque
     headlines, lime accents with Instrument Serif italics, then cream. */
  :root {
    --hero: #081e1b; --hero-2: #0f2c25; --on-hero: #f6fbf4; --on-hero-2: #bbd0c5; --hero-line: rgba(246,251,244,.12);
    --lime: #d8fb96; --lime-ink: #10251c;
    --bg: #f8f8f3; --surface: #ffffff; --ink: #16372f; --ink-2: #33524a; --muted: #6b7d76;
    --line: #e6e9e1; --grid: #eef0ea; --mark: #1f7a4d; --mark-soft: #e5f3e6; --up: #1f7a4d; --down: #b4472c;
    --display: "Bricolage Grotesque", Geist, system-ui, sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Geist, Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1184px; margin: 0 auto; padding: 0 24px; }
  button:focus-visible, summary:focus-visible, a:focus-visible, .chart:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
  main button:focus-visible, main summary:focus-visible, main .chart:focus-visible { outline-color: var(--mark); }

  /* ---- hero ---- */
  .hero { padding-bottom: 28px !important; background: radial-gradient(900px 500px at 85% 0%, rgba(216,251,150,.08), transparent 60%), radial-gradient(700px 500px at 0% 100%, rgba(31,122,77,.18), transparent 60%), linear-gradient(180deg, var(--hero), var(--hero-2)); color: var(--on-hero); padding-bottom: 40px; }
  nav { display: flex; align-items: center; gap: 16px; padding: 22px 0; border-bottom: 1px solid var(--hero-line); }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--on-hero); text-decoration: none; font: 800 26px/1 var(--display); letter-spacing: -.04em; }
  .brand img { width: 36px; height: auto; }
  nav .spacer { flex: 1; }
  nav a.back { color: var(--on-hero); text-decoration: none; font-weight: 600; font-size: 14px; }
  nav a.cta { background: var(--lime); color: var(--lime-ink); text-decoration: none; font-weight: 700; font-size: 14px; padding: 11px 18px; border-radius: 999px; display: inline-flex; gap: 10px; align-items: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; padding: 8px 16px 8px 10px; border: 1px solid var(--hero-line); border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--on-hero-2); background: rgba(246,251,244,.03); }
  .eyebrow i { width: 16px; height: 16px; border-radius: 50%; background: rgba(216,251,150,.18); display: grid; place-items: center; }
  .eyebrow i::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); }
  .head-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin-top: 16px; }
  .headline { margin: 0; font: 800 clamp(34px, 4.6vw, 52px)/1 var(--display); letter-spacing: -.06em; color: var(--on-hero); }
  .headline em { font: italic 400 .9em/1 var(--serif); letter-spacing: -.01em; color: var(--lime); margin-left: .25em; }
  .headline-delta { margin-top: 8px; font-size: 13px; color: var(--on-hero-2); min-height: 1em; }
  .headline-delta .up { color: var(--lime); font-weight: 600; } .headline-delta .down { color: #ffb89c; font-weight: 600; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .hero .label { color: var(--on-hero-2); margin: 28px 0 10px; }
  .ranges { display: flex; flex-wrap: wrap; gap: 6px; }
  .ranges button { font: 600 14px Geist, Inter, sans-serif; color: var(--on-hero); background: rgba(246,251,244,.04); border: 1px solid rgba(246,251,244,.22); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .ranges button:hover { border-color: rgba(246,251,244,.45); }
  .ranges button[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
  .tiles:empty { display: none; }
  .tile { background: rgba(246,251,244,.05); border: 1px solid var(--hero-line); border-radius: 18px; padding: 16px 20px; min-width: 0; backdrop-filter: blur(6px); }
  .tile .k { font-size: 13px; color: var(--on-hero-2); }
  .tile .value { font: 800 30px/1.05 var(--display); letter-spacing: -.05em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .delta { font-size: 13px; margin-top: 4px; color: var(--on-hero-2); }
  .tile .delta:empty { display: none; }
  .tile .up { color: var(--lime); font-weight: 600; } .tile .down { color: #ffb89c; font-weight: 600; }

  /* ---- cream content ---- */
  main { padding: 48px 0 12px; }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 36px 0 14px; }
  .section-title:first-child { margin-top: 0; }
  .section-title h2 { margin: 0; font: 800 clamp(28px, 3.4vw, 40px)/1.05 var(--display); letter-spacing: -.06em; color: var(--ink); }
  .section-title h2 em { font: italic 400 1.05em var(--serif); letter-spacing: -.01em; color: var(--mark); }
  .section-title .label { color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px; min-width: 0; box-shadow: 0 1px 0 rgba(22,55,47,.03), 0 12px 32px -24px rgba(22,55,47,.25); }
  .panel h3, .chart-card h3 { margin: 0 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font: 700 20px/1.2 var(--display); letter-spacing: -.03em; }
  .panel h3 span, .chart-card h3 span { font: 600 11px Geist, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .chart { position: relative; height: 260px; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chart .tip { position: absolute; pointer-events: none; background: var(--hero); color: var(--on-hero); border-radius: 12px; padding: 9px 12px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -115%); display: none; box-shadow: 0 10px 24px -10px rgba(8,30,27,.5); }
  .tip strong { display: block; font: 800 17px var(--display); letter-spacing: -.03em; color: var(--lime); }
  details { margin-top: 12px; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; }
  details table { margin-top: 8px; }

  .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th { text-align: right; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 0 8px 8px; }
  th:first-child { text-align: left; padding-left: 0; }
  td { padding: 0; border-top: 1px solid var(--grid); }
  td.n { text-align: right; padding: 8px 0 8px 8px; color: var(--ink-2); white-space: nowrap; }
  .bar { position: relative; padding: 8px 10px; min-width: 0; }
  .bar b { position: absolute; inset: 4px auto 4px 0; background: var(--mark-soft); border-radius: 0 6px 6px 0; }
  .bar span { position: relative; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

  .notice { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 32px; max-width: 620px; }
  .notice h2 { margin: 0 0 10px; font: 800 30px/1.1 var(--display); letter-spacing: -.05em; }
  .notice p { margin: 8px 0; color: var(--ink-2); }
  .notice a.btn { display: inline-block; margin-top: 14px; background: var(--hero); color: var(--lime); padding: 12px 20px; border-radius: 999px; text-decoration: none; font-weight: 700; }
  code { background: var(--mark-soft); padding: 1px 6px; border-radius: 6px; font-size: 13px; }
  footer { padding: 28px 0 48px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  footer svg { flex: none; }

  @media (max-width: 960px) { .grid, .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 520px) {
    .wrap { padding: 0 16px; } nav a.back { display: none; } .tiles { grid-template-columns: 1fr 1fr; } .tile:last-child { grid-column: 1 / -1; } .tile .value { font-size: 26px; }
    .ranges button { padding: 8px 13px; font-size: 14px; } .card { padding: 18px; }
    .section-title .label { display: none; }
  }
</style>
</head>
<body>
<div class="hero">
  <div class="wrap">
    <nav>
      <a class="brand" href="/"><img src="/landing/homebeta-header-mark.webp" alt="" width="36" height="25">wellnest</a>
      <span class="spacer"></span>
      <a class="back" href="/">Back to site</a>
      <a class="cta" href="/dashboard">Open app <span aria-hidden="true">↗</span></a>
    </nav>
    <div class="eyebrow"><i></i><span id="live">SITE STATISTICS</span></div>
    <div class="head-row">
      <div><h1 class="headline" id="headline">Your visitors<em>loading…</em></h1><div class="headline-delta" id="headline-delta"></div></div>
      <div class="ranges" role="group" aria-label="Date range" id="ranges">
      <button data-days="1">24 hours</button><button data-days="7">7 days</button><button data-days="30">30 days</button><button data-days="90">90 days</button><button data-days="365">12 months</button>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
  </div>
</div>
<div class="wrap">
  <main id="main"><p class="empty">Loading…</p></main>
  <footer><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Counted by WellNest's own server — no cookies, no IP addresses stored. Visitors are counted once per day.</footer>
</div>

<script>
(function () {
  "use strict";
  var API = location.hostname.endsWith("github.io") ? "https://wellnest.services" : "";
  var main = document.getElementById("main");
  var days = Number(new URLSearchParams(location.search).get("days")) || 30;
  var regionNames = null;
  try { regionNames = new Intl.DisplayNames([navigator.language || "en"], { type: "region" }); } catch (e) {}

  // ---------- tiny DOM helper (textContent only: names come from visitors) ----------
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    for (var k in attrs || {}) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  var fmt = new Intl.NumberFormat();
  function num(v) { return fmt.format(Math.round(v || 0)); }
  function dur(s) {
    s = Math.round(s || 0);
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60), r = s % 60;
    return m < 60 ? m + "m " + (r < 10 ? "0" : "") + r + "s" : Math.floor(m / 60) + "h " + (m % 60) + "m";
  }
  function country(code) {
    if (!code || code === "XX" || code === "T1") return "Unknown";
    var flag = String.fromCodePoint.apply(null, code.toUpperCase().split("").map(function (c) { return 127397 + c.charCodeAt(0); }));
    var name = code; try { name = regionNames ? regionNames.of(code) : code; } catch (e) {}
    return flag + "  " + name;
  }
  function pretty(path) { return path === "/" ? "/ (home)" : path; }

  // ---------- sign-in token (the site's own sign-in keeps it in localStorage) ----------
  function stored() { try { return JSON.parse(localStorage.getItem("gotrue.user") || "null"); } catch (e) { return null; } }
  async function refresh() {
    var u = stored();
    if (!u || !u.token || !u.token.refresh_token) return false;
    var res = await fetch(API + "/api/_identity/token", {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(u.token.refresh_token),
    });
    if (!res.ok) return false;
    var t = await res.json();
    u.token = Object.assign({}, u.token, t, { expires_at: Date.now() + (t.expires_in || 3600) * 1000 });
    try { localStorage.setItem("gotrue.user", JSON.stringify(u)); } catch (e) {}
    return true;
  }
  async function getStats(retry) {
    var u = stored();
    var headers = u && u.token && u.token.access_token ? { Authorization: "Bearer " + u.token.access_token } : {};
    var res = await fetch(API + "/api/analytics/stats?days=" + days + "&tz=" + (-new Date().getTimezoneOffset()), { headers: headers, credentials: "include" });
    if (res.status === 401 && !retry && await refresh()) return getStats(true);
    return res;
  }

  function notice(title, lines, link) {
    headline("Site statistics", "nothing to show yet.");
    document.getElementById("headline-delta").replaceChildren();
    document.getElementById("tiles").replaceChildren();
    main.replaceChildren(el("div", { class: "notice" }, [el("h2", { text: title })].concat(lines.map(function (l) {
      return el("p", {}, Array.isArray(l) ? l : [l]);
    })).concat(link ? [el("a", { class: "btn", href: link[1], text: link[0] })] : [])));
  }

  // ---------- pieces ----------
  function delta(d, now, before, lowerIsBetter, format) {
    if (before > 0 && now != null) {
      var pct = (now - before) / before * 100;
      var good = lowerIsBetter ? pct < 0 : pct > 0;
      var sign = pct > 0 ? "▲ " : pct < 0 ? "▼ " : "";
      d.appendChild(el("span", { class: Math.abs(pct) < 0.5 ? "" : good ? "up" : "down", text: sign + Math.abs(pct).toFixed(0) + "%" }));
      d.appendChild(document.createTextNode(" vs previous " + (format || "")));
    }
    return d;
  }
  function tile(label, value, now, before, lowerIsBetter, format) {
    var d = delta(el("div", { class: "delta" }), now, before, lowerIsBetter, format);
    return el("div", { class: "tile" }, [el("div", { class: "k", text: label }), el("div", { class: "value", text: value }), d]);
  }

  function table(title, rows, cols, opts) {
    opts = opts || {};
    var card = el("section", { class: "card panel" }, [el("h3", { text: title }, opts.note ? [el("span", { text: opts.note })] : [])]);
    if (!rows.length) { card.appendChild(el("p", { class: "empty", text: opts.empty || "Nothing yet for this period." })); return card; }
    var max = Math.max.apply(null, rows.map(function (r) { return r[cols[0].key] || 0; })) || 1;
    var head = el("tr", {}, [el("th", { text: opts.first || "" })].concat(cols.map(function (c) { return el("th", { text: c.label }); })));
    var body = rows.map(function (r) {
      var w = Math.max(2, (r[cols[0].key] || 0) / max * 100);
      var b = el("b"); b.style.width = w + "%";
      var name = opts.name ? opts.name(r.name) : (r.name || "Unknown");
      var cell = el("div", { class: "bar", title: name }, [b, el("span", { text: name })]);
      return el("tr", {}, [el("td", {}, [cell])].concat(cols.map(function (c) {
        return el("td", { class: "n", text: c.fmt ? c.fmt(r[c.key]) : num(r[c.key]) });
      })));
    });
    card.appendChild(el("table", {}, [el("thead", {}, [head]), el("tbody", {}, body)]));
    return card;
  }

  // Single-series line chart of visitors, with a crosshair tooltip and a table fallback.
  function lineChart(data) {
    var hourly = data.bucket < 86400000;
    var step = data.bucket, end = Date.now(), start = end - data.days * 86400000;
    var off = data.tz * 60000;
    var first = Math.floor((start + off) / step) * step - off;
    var byT = {}; data.series.forEach(function (p) { byT[p.t] = p; });
    var pts = [];
    for (var t = first; t <= end; t += step) pts.push({ t: t, visitors: (byT[t] || {}).visitors || 0, views: (byT[t] || {}).views || 0 });
    var label = function (t) {
      var d = new Date(t);
      return hourly ? d.toLocaleTimeString([], { hour: "numeric" }) + ", " + d.toLocaleDateString([], { weekday: "short" })
                    : d.toLocaleDateString([], { day: "numeric", month: "short", year: data.days > 120 ? "2-digit" : undefined });
    };

    var card = el("section", { class: "card chart-card" }, [el("h3", { text: "Visitors" }, [el("span", { text: "Hover for detail" })])]);
    var box = el("div", { class: "chart" });
    var tip = el("div", { class: "tip", role: "status" });
    card.appendChild(box);

    var W = 1000, H = 240, L = 40, R = 8, T = 10, B = 26;
    var max = Math.max(4, Math.max.apply(null, pts.map(function (p) { return p.visitors; })));
    var raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    var top = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag * 4; // 4 even steps
    var x = function (i) { return L + (pts.length < 2 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1)); };
    var y = function (v) { return T + (H - T - B) * (1 - v / top); };
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Visitors " + (hourly ? "per hour" : "per day") + ", see table below");
    function s(tag, a) { var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); svg.appendChild(n); return n; }
    for (var g = 0; g <= 4; g++) {
      var gv = top * g / 4;
      s("line", { x1: L, x2: W - R, y1: y(gv), y2: y(gv), stroke: "var(--grid)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" });
    }
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.visitors).toFixed(1); }).join(" ");
    s("path", { d: d + " L" + x(pts.length - 1) + " " + y(0) + " L" + x(0) + " " + y(0) + " Z", fill: "var(--mark-soft)", opacity: 0.6 });
    s("path", { d: d, fill: "none", stroke: "var(--mark)", "stroke-width": 2, "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" });
    var cross = s("line", { y1: T, y2: H - B, stroke: "var(--muted)", "stroke-width": 1, "vector-effect": "non-scaling-stroke", visibility: "hidden" });
    box.appendChild(svg);

    // Axis labels as HTML so the text never stretches with the chart.
    for (var a = 0; a <= 4; a++) {
      var lab = el("div", { text: num(top * a / 4) });
      lab.style.cssText = "position:absolute;left:0;font-size:11px;color:var(--muted);transform:translateY(-50%);top:" + (y(top * a / 4) / H * 100) + "%";
      box.appendChild(lab);
    }
    var ticks = Math.min(window.innerWidth < 600 ? 4 : 6, pts.length);
    for (var k = 0; k < ticks; k++) {
      var idx = Math.round(k * (pts.length - 1) / Math.max(1, ticks - 1));
      var xl = el("div", { text: label(pts[idx].t) });
      xl.style.cssText = "position:absolute;bottom:0;font-size:11px;color:var(--muted);white-space:nowrap;transform:translateX(" + (k === 0 ? "0" : k === ticks - 1 ? "-100%" : "-50%") + ");left:" + (x(idx) / W * 100) + "%";
      box.appendChild(xl);
    }
    box.appendChild(tip);

    function show(i) {
      var p = pts[i], px = x(i) / W * 100;
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      tip.replaceChildren(el("strong", { text: num(p.visitors) + " visitor" + (p.visitors === 1 ? "" : "s") }), el("span", { text: num(p.views) + " page views · " + label(p.t) }));
      tip.style.display = "block"; tip.style.left = Math.min(85, Math.max(15, px)) + "%"; tip.style.top = (y(p.visitors) / H * 100) + "%";
    }
    function hide() { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; }
    box.addEventListener("pointermove", function (e) {
      var r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * W;
      var i = Math.round((vx - L) / ((W - L - R) / Math.max(1, pts.length - 1)));
      show(Math.max(0, Math.min(pts.length - 1, i)));
    });
    box.addEventListener("pointerleave", hide);
    box.tabIndex = 0; var cur = pts.length - 1;
    box.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") cur = Math.max(0, cur - 1); else if (e.key === "ArrowRight") cur = Math.min(pts.length - 1, cur + 1); else return;
      e.preventDefault(); show(cur);
    });
    box.addEventListener("blur", hide);

    var rows = pts.slice().reverse().map(function (p) { return el("tr", {}, [el("td", { class: "n", style: "text-align:left", text: label(p.t) }), el("td", { class: "n", text: num(p.visitors) }), el("td", { class: "n", text: num(p.views) })]); });
    card.appendChild(el("details", {}, [el("summary", { text: "Show as table" }),
      el("table", {}, [el("thead", {}, [el("tr", {}, [el("th", { text: hourly ? "Hour" : "Day" }), el("th", { text: "Visitors" }), el("th", { text: "Page views" })])]), el("tbody", {}, rows)])]));
    return card;
  }

  // ---------- render ----------
  function sectionTitle(text, accent, label) {
    return el("div", { class: "section-title" }, [el("h2", {}, [text + " ", el("em", { text: accent })]), label ? el("span", { class: "label", text: label }) : null]);
  }
  var RANGE_WORDS = { 1: "in the last 24 hours.", 7: "in the last 7 days.", 30: "in the last 30 days.", 90: "in the last 90 days.", 365: "in the last 12 months." };
  function headline(big, small) {
    document.getElementById("headline").replaceChildren(document.createTextNode(big), el("em", { text: small }));
  }

  function render(data) {
    var t = data.totals || {}, p = data.previous || {};
    var period = data.days === 1 ? "24 hours" : data.days === 365 ? "12 months" : data.days + " days";
    document.getElementById("live").textContent = "SITE STATISTICS · " + num(data.live) + " ON THE SITE NOW";
    headline(num(t.visitors) + " visitor" + (t.visitors === 1 ? "" : "s"), RANGE_WORDS[data.days] || "in this period.");
    var hd = document.getElementById("headline-delta"); hd.replaceChildren(); delta(hd, t.visitors, p.visitors, false, period);

    if (!t.views) {
      document.getElementById("tiles").replaceChildren();
      main.replaceChildren(el("div", { class: "notice" }, [el("h2", { text: "No visits counted yet" }),
        el("p", { text: "Visits show up here a few seconds after they happen. Open any page of wellnest.services in another tab, then refresh this page." })]));
      return;
    }
    document.getElementById("tiles").replaceChildren(
      tile("Page views", num(t.views), t.views, p.views, false, period),
      tile("Avg. time on site", dur(t.avg_session_seconds), t.avg_session_seconds, p.avg_session_seconds, false, period),
      tile("Bounce rate", (t.bounce_rate || 0).toFixed(0) + "%", t.bounce_rate, p.bounce_rate, true, period)
    );

    var visitorsCol = [{ key: "visitors", label: "Visitors" }, { key: "views", label: "Views" }];
    var pages = table("Top pages", data.pages, [{ key: "views", label: "Views" }, { key: "visitors", label: "Visitors" }, { key: "avg_seconds", label: "Avg. time", fmt: function (v) { return v ? dur(v) : "–"; } }], { first: "Page", name: pretty });
    var countries = table("Countries", data.countries, visitorsCol, { first: "Country", name: country });
    var sources = table("Sources", data.sources, [{ key: "visitors", label: "Visitors" }], { first: "Source", name: function (n) { return n === "Direct" ? "Direct / typed in" : n; } });
    var campaigns = table("Campaigns", data.campaigns, [{ key: "visitors", label: "Visitors" }], { first: "utm_campaign", empty: "No links with utm_campaign visited in this period." });
    var devices = table("Devices", data.devices, visitorsCol, { first: "Device" });
    var browsers = table("Browsers", data.browsers, visitorsCol, { first: "Browser" });
    main.replaceChildren(
      sectionTitle("Traffic,", "over time.", data.bucket < 86400000 ? "Per hour" : "Per day"),
      lineChart(data),
      sectionTitle("What they", "looked at.", "Pages & places"),
      el("div", { class: "grid" }, [pages, countries]),
      sectionTitle("How they", "found you.", "Sources & devices"),
      el("div", { class: "grid2" }, [sources, campaigns, devices, browsers])
    );
  }

  async function load() {
    document.querySelectorAll("#ranges button").forEach(function (b) { b.setAttribute("aria-pressed", String(Number(b.dataset.days) === days)); });
    try {
      var res = await getStats(false);
      if (res.status === 401) {
        notice("Sign in to see site statistics", ["Sign in to WellNest with your admin account, then come back to this page."], ["Sign in", "/login?redirect=" + encodeURIComponent(location.pathname)]);
        return;
      }
      var body = await res.json().catch(function () { return {}; });
      if (res.status === 403) {
        var who = body.signed_in_as || "this account";
        notice("This account can't see statistics", [
          ["You're signed in as ", el("strong", { text: who }), "."],
          body.admin_emails_set
            ? ["The site can see ", el("code", { text: "ADMIN_EMAILS" }), ", but that email isn't in it. Check it's spelled exactly as above."]
            : ["The site can't see an ", el("code", { text: "ADMIN_EMAILS" }), " setting yet. In Cloudflare, open ", el("strong", { text: "Workers & Pages → wellnest → Settings → Variables and Secrets" }), " (not the Build variables section), add ", el("code", { text: "ADMIN_EMAILS" }), " with the email above, and choose Deploy."],
        ]);
        return;
      }
      if (!res.ok) throw new Error(body.error || res.statusText);
      render(body);
    } catch (e) {
      notice("Couldn't load statistics", ["Please try again in a moment. (" + (e && e.message || "network error") + ")"]);
    }
  }

  document.getElementById("ranges").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    days = Number(b.dataset.days);
    history.replaceState(null, "", "?days=" + days);
    load();
  });
  load();
  setInterval(function () { if (document.visibilityState === "visible") load(); }, 300000);
})();
</script>
</body>
</html>
