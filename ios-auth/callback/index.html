<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Return to WellNest</title>
<script>
(function() {
  var hash = window.location.hash || '';
  if (hash && hash.length > 1) {
    var appUrl = 'wellnest://auth-callback' + hash;
    window.location.replace(appUrl);
    setTimeout(function() {
      var btn = document.getElementById('open-app-btn');
      if (btn) {
        btn.href = appUrl;
        btn.style.display = 'inline-block';
      }
    }, 400);
  }
})();
</script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1114;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    text-align: center;
  }
  .card {
    background: #131e22;
    border: 1px solid rgba(55, 230, 194, 0.25);
    border-radius: 20px;
    padding: 36px 28px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 12px;
    color: #ffffff;
  }
  p {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.72);
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .btn {
    display: inline-block;
    width: 100%;
    padding: 14px 20px;
    background: linear-gradient(135deg, #37e6c2, #23c7a6);
    color: #0b1114;
    font-weight: 700;
    font-size: 16px;
    border-radius: 12px;
    text-decoration: none;
    box-sizing: border-box;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Return to WellNest</h1>
    <p>Completing sign in... If you are not returned to the app automatically, tap the button below.</p>
    <a id="open-app-btn" class="btn" href="wellnest://auth-callback">Open WellNest</a>
  </div>
</body>
</html>
